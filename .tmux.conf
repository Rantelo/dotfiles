bind-key W send-keys ":wa" C-m
bind-key X send-keys ":q" C-m
set -g command-alias[100] exito='kill-server'

set -g mouse on

# 0: SCRATCH - Single Claude instance for the whole team
new-session -s rantelo -n scratch -c ~ -d
split-window -v -t rantelo:0 -c ~
send-keys -t rantelo:0.0 "claude"
send-keys -t rantelo:0.1 "nvim"

# 1: DEV - Active coding context
new-window -n dev -t rantelo:1 -c ~/Dev/frontend
split-window -v -t rantelo:1 -c ~/Dev/backend

# 2: INFRA - Infrastructure and Security
new-window -n infra -t rantelo:2 -c ~/Dev
split-window -v -t rantelo:2 -c ~/Dev
# Space reserved for Terraform or Security audits

# 3: MGMT - Leadership and Docs
new-window -n mgmt -t rantelo -c "/Users/roberto.antelo/r.antelo@ca.taly.st - Google Drive/My Drive/00_TechLead"
split-window -v -t rantelo:3 -c "/Users/roberto.antelo/r.antelo@ca.taly.st - Google Drive/My Drive/00_TechLead"
send-keys -t rantelo:3.0 "nvim" C-m
send-keys -t rantelo:3.1 "claude" C-m

# Default View
select-window -t rantelo:3
select-pane -t rantelo:3.0

